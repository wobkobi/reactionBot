# TrueNAS SCALE 24.10+ (Electric Eel and later, which run Docker rather than
# k3s). Paste into Apps > Discover Apps > the three-dot menu > Install via YAML.
#
# It pulls a published image because the Apps UI cannot build one, and its
# paths are absolute because it has no build context. Replace POOL below.
#
# Create the dataset with the Apps preset or a POSIX ACL: on an SMB-style
# dataset the NFSv4 ACL overrides the ownership and the bot cannot write its
# own config. 568 is the apps user.
#
# From the TrueNAS shell first:
#
#   mkdir -p /mnt/POOL/apps/reactionbot/data/sounds
#
#   # Seed the config templates from the image, since a bind mount hides
#   # whatever it ships at /app/data.
#   docker create --name rb-seed ghcr.io/wobkobi/reactionbot:latest
#   docker cp rb-seed:/app/data/. /mnt/POOL/apps/reactionbot/data/
#   docker rm rb-seed
#
#   vi /mnt/POOL/apps/reactionbot/.env        # BOT_TOKEN and CLIENT_ID
#   chmod 600 /mnt/POOL/apps/reactionbot/.env
#   chown -R 568:568 /mnt/POOL/apps/reactionbot
#
# words.json is gitignored and not in the image, so copy your own into
# data/global/words.json.

services:
  reactionbot:
    image: ghcr.io/wobkobi/reactionbot:latest
    restart: unless-stopped

    # A tag is not a subscription: without this, restarting the app reuses the
    # image already on disk and the container comes back on the same code it
    # was already running. Pulling on every start makes "restart it" the update.
    pull_policy: always

    # Runs as the apps user rather than the image's built-in uid 1000, so the
    # files it writes stay readable and editable from the TrueNAS side.
    user: "568:568"

    # Kept out of the app config so the token is not stored in the Apps UI.
    env_file: /mnt/POOL/apps/reactionbot/.env

    environment:
      # uid 568 has no home directory in the image. Anything that falls back to
      # a home-relative cache would otherwise try to write to / and fail.
      HOME: /app/data
      # Pretty output timestamps itself when not attached to a terminal, which
      # is what the Apps UI log viewer shows. LOG_LEVEL=debug adds the
      # per-utterance voice decisions; either can be set in the .env instead.
      LOG_LEVEL: info
      LOG_FORMAT: pretty

    volumes:
      - /mnt/POOL/apps/reactionbot/data:/app/data

    # ffmpeg conversions can leave orphaned grandchildren; init reaps them.
    init: true

    # Speech recognition holds around 1.9GB with the default whisper-base.en.
    # This is an OOM guard, not a target. Remember ZFS ARC is competing for the
    # same RAM: leave the box headroom rather than sizing this to what is free.
    mem_limit: 4g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
