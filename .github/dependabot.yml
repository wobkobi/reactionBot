# Dependabot opens at most 5 version-update PRs per ecosystem, and once 5 are open it
# skips the scheduled run entirely - including the step that closes PRs a manual update
# has already superseded. A couple of stuck PRs (lockfile conflicts, held majors) is
# enough to stop npm updates silently, so minor and patch bumps share one grouped PR
# and majors known to be blocked are ignored rather than left open.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Stay on TypeScript 6 until typescript-eslint's peer range covers 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Keeps the `uses:` tags in .github/workflows current. Without this, pinned
  # actions silently fall behind and the runner warns about their declared
  # Node runtime (node20 actions forced onto node24).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
