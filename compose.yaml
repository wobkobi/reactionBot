services:
  reactionbot:
    build: .
    image: reactionbot:latest
    restart: unless-stopped

    # BOT_TOKEN and CLIENT_ID are required; see .env.example for the rest.
    env_file: .env

    environment:
      # Pretty output carries a timestamp whenever it is not attached to a
      # terminal, so `docker compose logs` reads correctly as it stands. Set
      # LOG_FORMAT=json to feed a collector instead.
      LOG_FORMAT: ${LOG_FORMAT:-pretty}

    volumes:
      # Bind-mounted, not a named volume, so config and clips stay editable
      # from the host; the bot picks config edits up without a restart. Runs as
      # uid 1000, so: chown -R 1000:1000 ./data
      - ./data:/app/data

    # ffmpeg conversions can leave orphaned grandchildren; init reaps them.
    init: true

    # Speech recognition sits around 1.9GB with whisper-base.en, so this is an
    # OOM guard rather than a target. whisper-tiny.en fits in 2G.
    mem_limit: 4g

    # Without a cap the log file grows until the disk does not. Three 10MB files
    # is a few days of ordinary chatter and survives a restart loop.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # No cpu request: outside Swarm a reservation guarantees nothing, and a cap
    # would only slow this down. Give the host enough instead - base.en takes
    # ~1.5s per utterance on 4 cores against 4.8s on 2, and past ~3s utterances
    # age out of the queue unheard. On 2 cores use whisper-tiny.en.
